{% extends "admin/change_form.html" %}
{% load i18n admin_urls static admin_modify %}

{% block object-tools %}
    {{ block.super }}

    <!-- BuxDU Smart Admin Native Django Action Bar -->
    <div class="buxdu-django-admin-bar" id="buxdu-django-bar">
        <div class="django-bar-left">
            <span class="django-bar-dot"></span>
            <strong class="django-bar-title">BuxDU Smart Assistant</strong>
            <span class="django-bar-badge">2026 Alifbo Reformasi: Ö, Ğ, Ş, Ç</span>
        </div>
        <div class="django-bar-actions">
            <!-- 1. ALIFBOGA O'TKAZISH TUGMASI -->
            <button type="button" id="btn-transliterate-new" class="django-admin-btn django-btn-accent" title="Barcha o'zbekcha so'zlarni yangi 2026 alifbosiga (Ö, Ğ, Ş, Ç) o'tkazish">
                <span class="btn-icon">⚡</span> Yangi Alifboga O'tkazish (Ö, Ğ, Ş, Ç)
            </button>
            <!-- 2. AVTO-TARJIMA TUGMASI -->
            <button type="button" id="btn-auto-translate" class="django-admin-btn django-btn-primary" title="O'zbekcha matnni rus, ingliz va xitoy tillariga avtomatik tarjima qilish">
                <span class="btn-icon">🌐</span> Tillarga Avto-Tarjima (RU, EN, ZH)
            </button>
            <!-- 3. 1-BOSISHDA HAMMASI -->
            <button type="button" id="btn-master-all" class="django-admin-btn django-btn-master" title="Yangi alifboga o'tkazish va 3 tilda tarjima qilishni bir vaqtda bajarish">
                <span class="btn-icon">🚀</span> 1-Bosishda Hammasi
            </button>
        </div>
    </div>

    <!-- Django Native Style Alert Message -->
    <div id="buxdu-django-alert" class="buxdu-django-alert hidden"></div>
{% endblock %}
